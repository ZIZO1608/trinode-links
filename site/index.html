<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trinode · WhatsApp</title>
<meta name="description" content="Chat with Trinode on WhatsApp. تواصل معنا عبر واتساب.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="https://trinode.ahmad-zaven.io/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://trinode.ahmad-zaven.io/">
<meta property="og:title" content="Trinode · WhatsApp">
<meta property="og:description" content="Chat with Trinode on WhatsApp. تواصل معنا عبر واتساب.">
<meta property="og:image" content="https://trinode.ahmad-zaven.io/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: one narrow column; the three WhatsApp lines hang off a copper wire like the logo's three nodes */
:root {
  --bg: #F7F6F3;
  --surface: #FFFFFF;
  --ink: #12141A;
  --muted: #6B6A66;
  --line: #E4E1DA;
  --copper: #B87233;
  --copper-soft: #F3E6D9;
  --wa: #1A9E55;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --font-sans: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-ar: "IBM Plex Sans Arabic", "IBM Plex Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --surface: #191C21; --ink: #F5F2EC; --muted: #9A978F;
    --line: #2A2D33; --copper: #C98546; --copper-soft: #2B2219; --wa: #3CC57A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --surface: #191C21; --ink: #F5F2EC; --muted: #9A978F;
  --line: #2A2D33; --copper: #C98546; --copper-soft: #2B2219; --wa: #3CC57A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100%;
}
.wrap {
  max-width: 440px;
  margin: 0 auto;
  padding-block: clamp(40px, 9vh, 88px) 40px;
  display: flex;
  flex-direction: column;
  gap: 40px;
}

/* Logo */
.brand { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.logo { width: min(300px, 82%); height: auto; display: block; }
.logo-dark { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .logo-light { display: none; }
  :root:not([data-theme="light"]) .logo-dark { display: block; }
}
:root[data-theme="dark"] .logo-light { display: none; }
:root[data-theme="dark"] .logo-dark { display: block; }

.tag {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: center;
  margin: 0;
}
.tag-ar {
  font-family: var(--font-ar);
  font-size: 14px;
  color: var(--muted);
  margin: -10px 0 0;
  text-align: center;
}

/* Node list */
.nodes {
  list-style: none;
  margin: 0;
  padding: 0;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.nodes::before {
  content: "";
  position: absolute;
  left: 11px;
  top: 34px;
  bottom: 34px;
  width: 2px;
  background: var(--copper);
  border-radius: 2px;
}
.node {
  position: relative;
  display: grid;
  grid-template-columns: 24px 1fr;
  gap: 14px;
  align-items: center;
}
.ring {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2.5px solid var(--copper);
  background: var(--bg);
  position: relative;
  z-index: 1;
}
.card {
  min-width: 0;
  display: flex;
  align-items: stretch;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  transition: border-color .18s ease, transform .18s ease;
}
.card:hover { border-color: var(--copper); }
.chat {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  color: inherit;
  text-decoration: none;
}
.chat:active { transform: scale(0.98); }
.chat:focus-visible, .copy:focus-visible { outline: 2px solid var(--copper); outline-offset: -2px; }
.wa {
  flex: none;
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: var(--copper-soft);
  color: var(--wa);
  display: grid;
  place-items: center;
}
.wa svg { width: 22px; height: 22px; display: block; }
.txt { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.name {
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.num {
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 19px;
  letter-spacing: 0.02em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  user-select: all;
}
.go {
  margin-left: auto;
  flex: none;
  color: var(--copper);
  font-family: var(--font-mono);
  font-size: 18px;
}
.copy {
  flex: none;
  border: 0;
  border-left: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 0 14px;
  min-width: 64px;
  cursor: pointer;
  transition: color .15s ease, background .15s ease;
}
.copy:hover { color: var(--ink); background: var(--copper-soft); }
.copy.done { color: var(--wa); }

footer {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--muted);
  text-align: center;
  text-transform: uppercase;
}

@media (max-width: 380px) {
  .num { font-size: 17px; }
  .chat { padding: 12px; gap: 10px; }
  .go { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<main class="wrap">
  <header class="brand">
    <img class="logo logo-light" alt="Trinode" src="/assets/logo-light.png" width="900" height="266">
    <img class="logo logo-dark" alt="" aria-hidden="true" src="/assets/logo-dark.png" width="900" height="266">
    <p class="tag">Chat with us on WhatsApp</p>
    <p class="tag-ar" dir="rtl" lang="ar">تواصل معنا عبر واتساب</p>
  </header>

  <ul class="nodes" id="nodes"></ul>

  <footer>Trinode · CRM &amp; ERP systems</footer>
</main>

<script>
(function () {
  const lines = [
    { name: "Zaven Jooharian", number: "0995650958" },
    { name: "Ahmad Sabagh", number: "0987323677" },
    { name: "Zohrab Arslanian", number: "0993181867" },
  ];
  const message = "مرحبا Trinode 👋 حابب استفسر عن خدماتكم";
  const waIcon = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a9.9 9.9 0 0 0-8.5 15l-1.4 5 5.1-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>';
  const fmt = n => n.slice(0, 4) + " " + n.slice(4, 7) + " " + n.slice(7);
  const intl = n => "963" + n.replace(/^0/, "");
  const list = document.getElementById("nodes");

  lines.forEach(({ name, number: n }, i) => {
    const li = document.createElement("li");
    li.className = "node";
    li.innerHTML =
      '<span class="ring" aria-hidden="true"></span>' +
      '<div class="card">' +
        '<a class="chat" href="https://wa.me/' + intl(n) + '?text=' + encodeURIComponent(message) + '" target="_blank" rel="noopener" aria-label="Chat on WhatsApp with ' + name + ', ' + fmt(n) + '">' +
          '<span class="wa">' + waIcon + '</span>' +
          '<span class="txt"><span class="name">' + name + '</span>' +
          '<span class="num">' + fmt(n) + '</span></span>' +
          '<span class="go" aria-hidden="true">→</span>' +
        '</a>' +
        '<button class="copy" type="button" id="copy-' + i + '" aria-label="Copy ' + name + '\'s number">Copy</button>' +
      '</div>';
    list.appendChild(li);

    const btn = li.querySelector(".copy");
    const numEl = li.querySelector(".num");
    btn.addEventListener("click", () => {
      const done = () => {
        btn.textContent = "Copied";
        btn.classList.add("done");
        setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("done"); }, 1600);
      };
      const fallback = () => {
        const r = document.createRange();
        r.selectNodeContents(numEl);
        const s = window.getSelection();
        s.removeAllRanges(); s.addRange(r);
        btn.textContent = "Selected";
        setTimeout(() => { btn.textContent = "Copy"; }, 1600);
      };
      try {
        navigator.clipboard.writeText(n).then(done, fallback);
      } catch (e) { fallback(); }
    });
  });
})();
</script>
</body>
</html>
